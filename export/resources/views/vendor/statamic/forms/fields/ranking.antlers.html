{{ once }}
    <script>
        (function() {
            document.addEventListener('dragstart', (e) => {
                var listItem = e.target.closest('[data-ranking] li');
                if (listItem) listItem.setAttribute('data-dragging', '');
            });

            document.addEventListener('dragend', (e) => {
                let listItem = e.target.closest('[data-ranking] li');
                if (listItem) listItem.removeAttribute('data-dragging');
            });

            document.addEventListener('dragover', (e) => {
                let list = e.target.closest('[data-ranking]');
                let listItem = e.target.closest('li');
                let dragged = list ? list.querySelector('[data-dragging]') : null;

                if (list && listItem && dragged && listItem !== dragged) {
                    e.preventDefault();
                    let rect = listItem.getBoundingClientRect();
                    if (e.clientY < rect.top + rect.height / 2) {
                        list.insertBefore(dragged, listItem);
                    } else {
                        list.insertBefore(dragged, listItem.nextSibling);
                    }
                }
            });
        })();
    </script>
{{ /once }}

<ol
    id="{{ id }}"
    data-ranking
    class="[&_li]:cursor-grab [&_li]:data-dragging:cursor-grabbing"
    :aria-invalid="form.invalid('{{ handle }}')"
    @dragend="form.{{ handle }} = Array.from($event.target.parentNode.querySelectorAll('[name={{ handle }}]'), element => element.value)"
    x-init="form.{{ handle }} = Array.from($el.querySelectorAll('[name={{ handle }}]'), element => element.value)"
    {{ instructions ?= 'aria-describedBy="{handle}-instructions"' }}
>
    {{ foreach:options as="option|label" }}
        <li draggable="true" class="flex items-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="fill-primary h-5" viewBox="0 0 256 256">
                <path d="M108,60A16,16,0,1,1,92,44,16,16,0,0,1,108,60Zm56,16a16,16,0,1,0-16-16A16,16,0,0,0,164,76ZM92,112a16,16,0,1,0,16,16A16,16,0,0,0,92,112Zm72,0a16,16,0,1,0,16,16A16,16,0,0,0,164,112ZM92,180a16,16,0,1,0,16,16A16,16,0,0,0,92,180Zm72,0a16,16,0,1,0,16,16A16,16,0,0,0,164,180Z"></path>
            </svg>
            <span>{{ label ?? option }}</span>
            <input type="hidden" name="{{ handle }}" value="{{ option }}">
        </li>
    {{ /foreach:options }}
</ol>
